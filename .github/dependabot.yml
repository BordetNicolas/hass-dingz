# https://docs.github.com/en/code-security/dependabot/dependabot-version-updates/configuration-options-for-the-dependabot.yml-file
version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"

  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"
    ignore:
      # Dependabot should not update Home Assistant as that should match the homeassistant key in hacs.json
      - dependency-name: "homeassistant"
      # These test dependencies are pinned to the exact versions required by the
      # pytest-homeassistant-custom-component release compatible with homeassistant.
      - dependency-name: "pytest"
      - dependency-name: "pytest-asyncio"
      - dependency-name: "pytest-homeassistant-custom-component"
      # pycares 5 breaks the aiodns version shipped with homeassistant.
      - dependency-name: "pycares"
    groups:
      pip-dependencies:
        patterns: [ "*" ]
        update-types: [ patch, minor ]
