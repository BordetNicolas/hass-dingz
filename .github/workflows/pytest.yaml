name: "Tests"

on:
  push:
    branches:
      - "main"
  pull_request:
    branches:
      - "main"

jobs:
  pytest:
    name: "Pytest"
    runs-on: ubuntu-latest
    steps:
      - name: "Checkout the repository"
        uses: actions/checkout@v6

      - name: "Set up Python"
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: "Install uv"
        uses: astral-sh/setup-uv@v7

      - name: "Install test dependencies"
        run: uv pip install --system -e ".[test]"

      - name: "Run tests"
        run: pytest -q
